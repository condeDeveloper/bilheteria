global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: bilheteria
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["app"]       # resolve todas as réplicas do serviço app
        type: A
        port: 8080

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
