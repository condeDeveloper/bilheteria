spring:
  application:
    name: bilheteria
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/bilheteria}
    username: ${POSTGRES_USUARIO:bilheteria}
    password: ${POSTGRES_SENHA:bilheteria}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORTA:6379}
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers, retries
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      pagamentos:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
  retry:
    instances:
      pagamentos:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

bilheteria:
  pagamentos:
    url: ${PAGAMENTOS_URL:http://localhost:8080/simulador/pagamentos}
  outbox:
    intervalo: 1000
  expiracao:
    intervalo: 15000
  jwt:
    chave: ${JWT_CHAVE:chave-de-desenvolvimento-troque-em-producao-0123456789}
  ingressos:
    chave: ${INGRESSOS_CHAVE:assinatura-dos-ingressos-em-desenvolvimento}
  usuarios:
    - nome: organizador
      senha: ${ORGANIZADOR_SENHA:organizador}
      papeis: [ORGANIZADOR, CLIENTE]
    - nome: ana
      senha: ${ANA_SENHA:ana}
      papeis: [CLIENTE]
    - nome: bruno
      senha: ${BRUNO_SENHA:bruno}
      papeis: [CLIENTE]

server:
  port: 8080
  shutdown: graceful
