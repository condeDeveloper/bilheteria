name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  testes:
    name: Testes rápidos (H2 e Kafka embutido)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire
          path: target/surefire-reports

  integracao:
    name: "Testes de integração com Testcontainers (PostgreSQL, Kafka, Redis)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Só os testes *IT, contra containers reais
        run: ./mvnw -B -ntp verify -Pintegracao -Dsurefire.skip=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe
          path: target/failsafe-reports

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [testes, integracao]
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/condedeveloper/bilheteria:latest
            ghcr.io/condedeveloper/bilheteria:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
