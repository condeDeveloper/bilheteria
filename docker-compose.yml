name: bilheteria

services:
  # ---------------- aplicação (duas réplicas atrás do mesmo Kafka e do mesmo banco) ----------------
  app:
    build: .
    image: bilheteria:local
    ports:
      - "8080-8081:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/bilheteria
      POSTGRES_USUARIO: bilheteria
      POSTGRES_SENHA: ${POSTGRES_SENHA:-bilheteria}
      KAFKA_SERVIDORES: kafka:9092
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      PAGAMENTOS_URL: http://localhost:8080/simulador/pagamentos
      JWT_CHAVE: ${JWT_CHAVE:-chave-de-desenvolvimento-troque-em-producao-0123456789}
      INGRESSOS_CHAVE: ${INGRESSOS_CHAVE:-assinatura-dos-ingressos-em-desenvolvimento}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2
    restart: unless-stopped

  # ---------------- dependências ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilheteria
      POSTGRES_USER: bilheteria
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:-bilheteria}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilheteria -d bilheteria"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: bilheteria-cluster-000000001
    ports:
      - "9094:9094"
    volumes:
      - kafka-dados:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: bilheteria
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- observabilidade ----------------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # interface dos traces
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres-dados:
  kafka-dados:
